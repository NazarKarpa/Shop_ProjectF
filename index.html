
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>GameSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="d-flex align-items-center py-3">
                <a href="index.html" class="text-decoration-none">
                    <img
                        src="#"
                        alt="GameSphere Logo"
                        class="logo"
                    >
                </a>
                <h5 class="main-tag mb-0 ms-2">
                    <a
                        href="index.html"
                        class="main-name text-decoration-none"
                    >
                        GameSphere
                    </a>
                </h5>

                <button
                type="button"
                class="btn btn-outline-light ms-auto d-block"
                data-bs-toggle="modal"
                data-bs-target="#cartModal"
                onclick="renderCart()">Cart
                <span
                    id="cartCount"
                    class="badge bg-primary"
                >
                </span>
            </button>
            </div>
        </div>

    </header>
    <main>
        <div class="container">
            <section class="py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        Our Games
                    </h2>
                    <div>
                        <button class="btn btn-outline-secondary">
                            All Games
                        </button>
                    </div>
                </div>
                <div
                    class="row g-4"
                    id="productsGrid"
                >
                </div>
            </section>
        </div>
    </main>


    <footer>
        <div class="container">
            <div class="py-4">
                <p class="mb-0">
                    © 2026 GameSphere
                </p>
            </div>
        </div>
    </footer>
<!-- Cart Modal -->
    <div
    class="modal fade"
    id="cartModal"
    tabindex="-1"
    aria-labelledby="cartModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5
                    class="modal-title"
                    id="cartModalLabel"
                >
                    Your Cart
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>

            <div class="modal-body">
                <div id="cartItems">
                </div>
            </div>

            <div class="modal-footer">

                <div class="me-auto">

                    <strong>
                        Total:
                    </strong>

                    <span id="cartTotal">
                        $0.00
                    </span>

                </div>

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Continue shopping
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="checkoutButton"
                >
                    Checkout
                </button>
            </div>
        </div>
    </div>
    </div>

<!-- Detail Game modal window -->
    <div class="modal" id="DetailModul" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Product name</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
            </div>
        </div>
    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

    <script src="main.js"></script>

</body>

</html>
